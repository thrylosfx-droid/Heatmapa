<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Heatmap v2</title>
<style>
:root{--bg:#0a0d12;--panel:#131822;--line:#252d3b;--tx:#d5dbe6;--mut:#7d889b;--buy:#2ecc8f;--sell:#ff5c6c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px system-ui,sans-serif;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
#bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-items:end}
label{display:flex;flex-direction:column;gap:2px;color:var(--mut);font-size:11px}
input{width:64px;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px;font-size:14px}
#sym{width:104px}
button{background:var(--buy);color:#04140d;border:0;border-radius:6px;padding:9px 14px;font-weight:700;font-size:14px}
button:disabled{opacity:.5}
#stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 8px 8px}
.s{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px}
.s b{display:block;font-size:15px;margin-top:2px}
canvas{width:100%;height:56vh;display:block;background:#05070a}
#log{padding:8px;max-height:24vh;overflow:auto}
#log div{padding:5px 0;border-bottom:1px solid var(--line)}
.b{color:var(--buy)}.r{color:var(--sell)}
#st{padding:0 8px 6px;color:var(--mut);font-size:11px}
</style>
</head>
<body>
<div id="bar">
  <button id="go">Boshlash</button>
  <label>Instrument<input id="sym" list="sl" value="XAUUSDT"></label>
  <datalist id="sl"><option value="XAUUSDT"><option value="BTCUSDT"><option value="QQQUSDT"><option value="ETHUSDT"></datalist>
  <label>Qadam ($)<input id="bin" type="number" step="0.1" value="0.5"></label>
  <label>Qatorlar<input id="rows" type="number" value="60"></label>
  <label>Devor (x)<input id="wall" type="number" step="0.5" value="4"></label>
  <label>Absorb hajm<input id="abs" type="number" value="50"></label>
  <label>Basis (broker-Binance)<input id="basis" type="number" step="0.01" value="0"></label>
</div>
<div id="st">Tayyor. "Boshlash" ni bosing.</div>
<div id="stats">
  <div class="s">Binance<b id="p1">-</b></div>
  <div class="s">Broker (taxmin)<b id="p2">-</b></div>
  <div class="s">Delta 60s<b id="dl">-</b></div>
  <div class="s">Bid/Ask 20 daraja<b id="im">-</b></div>
  <div class="s">Spred<b id="sp">-</b></div>
  <div class="s">Savdo/10s<b id="tv">-</b></div>
</div>
<canvas id="cv"></canvas>
<div id="log"></div>
<script>
const PRE={XAUUSDT:{bin:.5,abs:50},BTCUSDT:{bin:10,abs:5},ETHUSDT:{bin:.5,abs:50},QQQUSDT:{bin:.2,abs:100}};
const $=id=>document.getElementById(id);
let SYM='xauusdt',gen=0,running=false,ws,audio;
let bids=new Map(),asks=new Map(),lastU=0,buf=[],synced=false,first=true;
let cols=[],trades=[],colId=0,mid=0,best={bb:0,ba:0},seen={},active={},lastAbs=0;
const cfg=()=>({bin:+$('bin').value||0.5,rows:+$('rows').value||60,wall:+$('wall').value||4,abs:+$('abs').value||50,basis:+$('basis').value||0});
const status=t=>$('st').textContent=t;
const dec=b=>Math.max(0,Math.ceil(-Math.log10(b)));

$('go').onclick=()=>{
  try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  running=true;$('go').disabled=true;setSym();
};
$('sym').onchange=setSym;
function setSym(){
  SYM=($('sym').value||'XAUUSDT').trim().toLowerCase();
  const p=PRE[SYM.toUpperCase()];if(p){$('bin').value=p.bin;$('abs').value=p.abs}
  gen++;if(ws){try{ws.close()}catch(e){}}
  bids=new Map();asks=new Map();cols=[];trades=[];active={};seen={};colId=0;synced=false;buf=[];
  $('log').innerHTML='';
  if(running)connect();
}
function connect(){
  const g=gen;synced=false;buf=[];
  const w=new WebSocket('wss://fstream.binance.com/stream?streams='+SYM+'@depth@100ms/'+SYM+'@aggTrade');
  ws=w;
  w.onopen=()=>{status(SYM.toUpperCase()+': ulandi, order book yuklanmoqda...');snapshot(g)};
  w.onmessage=e=>{if(g!==gen)return;const m=JSON.parse(e.data);
    if(m.stream.indexOf('depth')>-1)onDepth(m.data);else onTrade(m.data)};
  w.onerror=()=>{try{w.close()}catch(e){}};
  w.onclose=()=>{if(g!==gen)return;status('Uzildi. Qayta ulanmoqda...');setTimeout(()=>{if(g===gen)connect()},2000)};
}
function snapshot(g){
  fetch('https://fapi.binance.com/fapi/v1/depth?symbol='+SYM.toUpperCase()+'&limit=1000')
   .then(r=>r.json()).then(s=>{
     if(g!==gen)return;
     if(!s.bids)throw new Error(s.msg||'xato');
     bids=new Map(s.bids.map(x=>[+x[0],+x[1]]));
     asks=new Map(s.asks.map(x=>[+x[0],+x[1]]));
     lastU=s.lastUpdateId;first=true;synced=true;
     const b=buf;buf=[];b.forEach(applyDepth);
     status(SYM.toUpperCase()+': jonli ma\'lumot ketmoqda');
   }).catch(e=>status('Snapshot xato: '+e.message));
}
function onDepth(d){if(!synced){buf.push(d);return}applyDepth(d)}
function applyDepth(d){
  if(d.u<=lastU)return;
  if(!first&&d.pu!==lastU){synced=false;buf=[d];snapshot(gen);return}
  first=false;
  d.b.forEach(x=>{const p=+x[0],q=+x[1];q?bids.set(p,q):bids.delete(p)});
  d.a.forEach(x=>{const p=+x[0],q=+x[1];q?asks.set(p,q):asks.delete(p)});
  lastU=d.u;
}
function onTrade(t){
  trades.push({t:Date.now(),p:+t.p,q:+t.q,buy:!t.m,col:colId});
  if(trades.length>3000)trades.splice(0,1000);
}
function alertMsg(msg,cls){
  const d=document.createElement('div');d.className=cls;
  d.textContent=new Date().toLocaleTimeString()+'  '+msg;
  $('log').prepend(d);
  while($('log').children.length>30)$('log').lastChild.remove();
  if(navigator.vibrate)navigator.vibrate(200);
  if(audio){const o=audio.createOscillator(),g=audio.createGain();
    o.frequency.value=cls==='b'?880:440;g.gain.value=.15;o.connect(g);g.connect(audio.destination);
    o.start();o.stop(audio.currentTime+.15)}
}
const brk=(p,c)=>c.basis?' (broker ~'+(p+c.basis).toFixed(dec(c.bin)+1)+')':'';

function tick(){
  if(!synced||!bids.size||!asks.size)return;
  const c=cfg(),dc=dec(c.bin);let bb=0,ba=1e12;
  for(const p of bids.keys())if(p>bb)bb=p;
  for(const p of asks.keys())if(p<ba)ba=p;
  mid=(bb+ba)/2;best={bb,ba};
  const mb=Math.floor(mid/c.bin),col={bin:c.bin,m:new Map(),avg:1};
  let sum=0,n=0;
  const add=(p,q,s)=>{const i=Math.floor(p/c.bin);
    if(Math.abs(i-mb)>c.rows)return;
    const o=col.m.get(i)||{q:0,s};o.q+=q;col.m.set(i,o)};
  for(const[p,q]of bids)add(p,q,'b');
  for(const[p,q]of asks)add(p,q,'a');
  col.m.forEach(o=>{sum+=o.q;n++});
  col.avg=sum/Math.max(n,1);
  const now=Date.now();
  // devorlar: kamida 2 soniya turgandan keyin signal, 2 daqiqada bir marta
  col.m.forEach((o,i)=>{
    if(o.q>col.avg*c.wall&&Math.abs(i-mb)<=c.rows/2){
      const k=o.s+i,a=active[k];
      if(!a)active[k]={s:o.s,i,q:o.q,n:1,al:false};
      else{a.n++;a.q=Math.max(a.q,o.q);
        if(a.n>=4&&!a.al&&(!seen[k]||now-seen[k]>120000)){
          a.al=true;seen[k]=now;const pr=i*c.bin;
          alertMsg((o.s==='b'?'BID':'ASK')+' devor '+o.q.toFixed(0)+' @ '+pr.toFixed(dc+1)+brk(pr,c),o.s==='b'?'b':'r');}}
    }
  });
  for(const k in active){const a=active[k],o=col.m.get(a.i);
    if(!o||o.q<col.avg*c.wall*.5){
      if(a.al&&Math.abs(a.i-mb)<=6){const pr=a.i*c.bin;
        alertMsg('Devor g\'oyib: '+(a.s==='b'?'BID':'ASK')+' @ '+pr.toFixed(dc+1)+brk(pr,c),a.s==='b'?'r':'b');}
      delete active[k];}
  }
  if(cols.length&&cols[cols.length-1].bin!==c.bin)cols=[];
  cols.push(col);colId++;
  if(cols.length>240)cols.shift();
  // absorption
  const t10=trades.filter(t=>now-t.t<10000);
  let bv=0,sv=0;t10.forEach(t=>t.buy?bv+=t.q:sv+=t.q);
  $('tv').textContent=(bv+sv).toFixed(2);
  if(t10.length>3&&now-lastAbs>20000){
    const ch=t10[t10.length-1].p-t10[0].p;
    if(sv>c.abs&&ch>-c.bin){lastAbs=now;alertMsg('Absorption: sotuvchilar '+sv.toFixed(1)+' urdi, narx tushmadi -> BUY ehtimoli'+brk(mid,c),'b')}
    else if(bv>c.abs&&ch<c.bin){lastAbs=now;alertMsg('Absorption: xaridorlar '+bv.toFixed(1)+' urdi, narx o\'smadi -> SELL ehtimoli'+brk(mid,c),'r')}
  }
  const t60=trades.filter(t=>now-t.t<60000);let dl=0;t60.forEach(t=>dl+=t.buy?t.q:-t.q);
  $('dl').textContent=dl.toFixed(1);$('dl').className=dl>=0?'b':'r';
  let bs=0,as=0;
  for(const[p,q]of bids)if(p>=mid-20*c.bin)bs+=q;
  for(const[p,q]of asks)if(p<=mid+20*c.bin)as+=q;
  $('im').textContent=(bs/(as||1)).toFixed(2);
  $('p1').textContent=mid.toFixed(dc+1);
  $('p2').textContent=(mid+c.basis).toFixed(dc+1);
  $('sp').textContent=(ba-bb).toFixed(dc+2);
  draw();
}

function draw(){
  const cv=$('cv'),dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)){cv.width=W*dpr;cv.height=H*dpr}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);
  const c=cfg(),dc=dec(c.bin),AX=96,CW=W-AX,N=240,cw=CW/N,rh=H/c.rows,mb=mid/c.bin;
  const yOf=p=>H/2-(p/c.bin-mb)*rh;
  cols.forEach((col,k)=>{
    const x=CW-(cols.length-k)*cw;
    col.m.forEach((o,i)=>{
      const y=H/2-(i+.5-mb)*rh;
      if(y<-rh||y>H)return;
      const r=o.q/col.avg;
      if(r<1.5)return;
      const v=Math.min(1,Math.log(r/1.5)/Math.log(c.wall*2.5));
      g.fillStyle='hsl('+(235-185*v)+',100%,'+(10+48*v)+'%)';
      g.fillRect(x,y,cw+.6,rh+.6);
    });
  });
  // joriy devorlar chizig'i
  const last=cols[cols.length-1];
  if(last){
    g.font='11px system-ui';g.setLineDash([4,4]);
    last.m.forEach((o,i)=>{
      if(o.q>last.avg*c.wall){
        const y=H/2-(i+.5-mb)*rh;
        g.strokeStyle=o.s==='b'?'rgba(46,204,143,.7)':'rgba(255,92,108,.7)';
        g.beginPath();g.moveTo(0,y);g.lineTo(CW,y);g.stroke();
        g.fillStyle=g.strokeStyle;g.fillText(o.q.toFixed(0),4,y-2);
      }
    });
    g.setLineDash([]);
  }
  // eng yaxshi bid/ask
  g.strokeStyle='#2ecc8f';g.beginPath();g.moveTo(0,yOf(best.bb));g.lineTo(CW,yOf(best.bb));g.stroke();
  g.strokeStyle='#ff5c6c';g.beginPath();g.moveTo(0,yOf(best.ba));g.lineTo(CW,yOf(best.ba));g.stroke();
  // savdolar
  trades.forEach(t=>{
    const age=colId-t.col;if(age>=N)return;
    const x=CW-age*cw,y=yOf(t.p);
    g.fillStyle=t.buy?'rgba(46,204,143,.9)':'rgba(255,92,108,.9)';
    g.beginPath();g.arc(x,y,Math.min(8,1.5+Math.sqrt(t.q)),0,6.3);g.fill();
  });
  // narx shkalasi
  g.fillStyle='#0a0d12';g.fillRect(CW,0,AX,H);
  g.font='10px system-ui';
  for(let y=14;y<H-6;y+=46){
    const p=(mb+(H/2-y)/rh)*c.bin;
    g.fillStyle='#9aa5b8';g.fillText(p.toFixed(dc+1),CW+4,y);
    if(c.basis){g.fillStyle='#e0b040';g.fillText((p+c.basis).toFixed(dc+1),CW+4,y+11)}
  }
  const ym=H/2;
  g.fillStyle='#fff';g.fillRect(CW,ym-8,AX,16);
  g.fillStyle='#000';g.font='bold 11px system-ui';
  g.fillText(mid.toFixed(dc+1)+(c.basis?' | '+(mid+c.basis).toFixed(dc+1):''),CW+3,ym+4);
}
setInterval(tick,500);
</script>
</body>
</html>
